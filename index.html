<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b10">
  <meta name="description" content="Espacio de estudio local para tus archivos, proyectos, tareas y repasos.">
  <title>FocusFlow — tu espacio, en local</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#090b10;--panel:#10141c;--panel2:#0d1118;--line:rgba(255,255,255,.085);--muted:#858d9c;--text:#eef2f8;--cyan:#5eead4;--blue:#8ba8ff;--lime:#bef264;--pink:#ff8cba}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Manrope',sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}::selection{background:rgba(94,234,212,.25)}
    .grid-bg{background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,black,transparent 87%)}
    .surface{background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border:1px solid var(--line);backdrop-filter:blur(16px)}
    .glow-border{position:relative;isolation:isolate}.glow-border:before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:linear-gradient(125deg,rgba(94,234,212,.46),transparent 30%,rgba(139,168,255,.17) 65%,transparent);background-size:200% 200%;animation:border-shift 8s linear infinite;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.72}
    @keyframes border-shift{to{background-position:200% 50%}}
    .mono{font-family:'DM Mono',monospace}.muted{color:var(--muted)}.nav-btn{color:#8e97a7;transition:all .2s}.nav-btn:hover,.nav-btn.active{color:#f3f6fb;background:rgba(255,255,255,.07)}.nav-btn.active{box-shadow:inset 2px 0 var(--cyan)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;border:1px solid var(--line);background:rgba(255,255,255,.055);padding:.65rem .9rem;border-radius:10px;font-size:.82rem;font-weight:700;transition:transform .2s,background .2s,border-color .2s,box-shadow .2s}.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}.btn-primary{background:var(--cyan);color:#08211e;border-color:transparent}.btn-primary:hover{background:#83f5df;box-shadow:0 8px 26px rgba(94,234,212,.18)}.btn-quiet{background:transparent}.icon-btn{width:38px;height:38px;padding:0;border-radius:10px}
    .stat-card,.tilt{transition:transform .25s,border-color .25s}.stat-card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.17)}.tag{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.02em;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:#aab3c1;background:rgba(255,255,255,.025)}
    .ping{position:relative}.ping:after{content:"";position:absolute;inset:-4px;border:1px solid currentColor;border-radius:50%;animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}@keyframes ping{75%,100%{transform:scale(2.2);opacity:0}}
    .view{display:none}.view.active{display:block}.field{width:100%;border:1px solid var(--line);background:#0b0e14;color:var(--text);border-radius:10px;padding:.72rem .8rem;outline:none}.field:focus{border-color:rgba(94,234,212,.65);box-shadow:0 0 0 3px rgba(94,234,212,.09)}textarea.field{resize:vertical;min-height:170px;line-height:1.75}.modal::backdrop{background:rgba(1,3,7,.75);backdrop-filter:blur(6px)}.modal{padding:0;border:1px solid rgba(255,255,255,.13);border-radius:16px;background:#10141c;color:var(--text);width:min(480px,calc(100% - 28px));box-shadow:0 30px 90px rgba(0,0,0,.55)}
    .cal-day{min-height:76px;border:1px solid transparent;border-radius:9px;padding:8px;transition:background .15s,border .15s}.cal-day:hover{background:rgba(255,255,255,.055)}.cal-day.selected{background:rgba(94,234,212,.08);border-color:rgba(94,234,212,.4)}.cal-day.today .day-number{color:var(--cyan)}.cal-day.outside{opacity:.3}.task-check{accent-color:#5eead4;width:16px;height:16px}.file-row:hover,.list-row:hover{background:rgba(255,255,255,.035)}.toast{animation:toast-in .25s ease-out}@keyframes toast-in{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
    @media(max-width:760px){.sidebar{display:none!important}.mobile-nav{display:flex!important}.main-content{padding:22px 16px 100px}.topbar{padding:14px 16px}.cal-day{min-height:55px;padding:5px}.cal-day .task-label{display:none}.desktop-only{display:none!important}}
  </style>
</head>
<body>
  <div class="fixed inset-0 grid-bg pointer-events-none"></div>
  <div class="relative min-h-screen">
    <aside class="sidebar fixed inset-y-0 left-0 z-30 flex w-[236px] flex-col border-r border-white/[.07] bg-[#090b10]/90 px-4 py-5 backdrop-blur-xl">
      <div class="mb-9 flex items-center gap-3 px-2">
        <div id="brand-mark" class="grid h-10 w-10 place-items-center rounded-xl border border-teal-200/20 bg-teal-300/[.09] text-teal-200"><i data-lucide="orbit" class="h-5 w-5"></i></div>
        <div><div class="text-[15px] font-extrabold tracking-tight">FocusFlow<span class="text-teal-300">.</span></div><div class="mono mt-0.5 text-[9px] uppercase tracking-[.18em] text-slate-500">local workspace</div></div>
      </div>
      <div class="mono mb-2 px-3 text-[9px] uppercase tracking-[.18em] text-slate-600">Workspace</div>
      <nav class="space-y-1" aria-label="Navegación principal">
        <button class="nav-btn active flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left text-[13px] font-semibold" data-view="home"><i data-lucide="layout-dashboard" class="h-4 w-4"></i>Resumen</button>
        <button class="nav-btn flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left text-[13px] font-semibold" data-view="files"><i data-lucide="hard-drive" class="h-4 w-4"></i>Archivos <span id="nav-files-count" class="mono ml-auto text-[10px] text-slate-600">0</span></button>
        <button class="nav-btn flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left text-[13px] font-semibold" data-view="agenda"><i data-lucide="calendar-days" class="h-4 w-4"></i>Agenda <span id="nav-tasks-count" class="mono ml-auto text-[10px] text-slate-600">0</span></button>
        <button class="nav-btn flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left text-[13px] font-semibold" data-view="study"><i data-lucide="notebook-pen" class="h-4 w-4"></i>Estudio</button>
      </nav>
      <div class="mono mb-2 mt-8 px-3 text-[9px] uppercase tracking-[.18em] text-slate-600">Tu espacio</div>
      <div id="sidebar-projects" class="space-y-1"></div>
      <button class="mt-2 flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left text-[12px] font-semibold text-slate-500 transition hover:bg-white/[.04] hover:text-slate-200" data-action="new-project"><i data-lucide="plus" class="h-4 w-4"></i>Nuevo proyecto</button>
      <div class="mt-auto rounded-xl border border-white/[.07] bg-white/[.025] p-3.5">
        <div class="mb-2 flex items-center gap-2"><span class="ping h-1.5 w-1.5 rounded-full bg-teal-300"></span><span class="mono text-[10px] uppercase tracking-wider text-teal-200">Solo en este dispositivo</span></div>
        <p class="m-0 text-[11px] leading-relaxed text-slate-500">Tus archivos se quedan en este navegador, pero el guardado local no está cifrado. Los paquetes de transferencia sí se cifran.</p>
      </div>
      <button class="mt-4 flex items-center gap-2 px-2 text-left" data-action="profile"><span id="avatar" class="grid h-8 w-8 place-items-center rounded-full bg-gradient-to-br from-teal-300/30 to-blue-400/20 text-xs font-extrabold text-teal-100">A</span><span class="min-w-0"><span id="user-name" class="block truncate text-xs font-bold">Local</span><span class="mono block text-[9px] text-slate-600">CUENTA LOCAL</span></span><i data-lucide="ellipsis" class="ml-auto h-4 w-4 text-slate-600"></i></button>
    </aside>

    <div class="ml-0 md:ml-[236px]">
      <header class="topbar sticky top-0 z-20 flex h-[68px] items-center justify-between border-b border-white/[.07] bg-[#090b10]/75 px-8 backdrop-blur-xl">
        <div class="flex items-center gap-2 text-xs"><span class="text-slate-600">espacio</span><i data-lucide="chevron-right" class="h-3 w-3 text-slate-700"></i><span id="breadcrumb" class="font-semibold text-slate-300">Resumen</span><span class="tag ml-2">LOCAL</span></div>
        <div class="flex items-center gap-2"><button class="btn btn-quiet icon-btn" title="Importar paquete cifrado" aria-label="Importar paquete cifrado" data-action="import"><i data-lucide="package-open" class="h-4 w-4"></i></button><button class="btn btn-quiet icon-btn" title="Exportar espacio cifrado" aria-label="Exportar espacio cifrado" data-action="export"><i data-lucide="lock-keyhole" class="h-4 w-4"></i></button><button class="btn btn-quiet icon-btn" title="Editar proyecto" aria-label="Editar proyecto" data-action="edit-project" hidden><i data-lucide="pencil" class="h-4 w-4"></i></button><button class="btn btn-quiet icon-btn text-slate-500 hover:text-rose-300" title="Eliminar proyecto" aria-label="Eliminar proyecto" data-action="delete-project" hidden><i data-lucide="folder-x" class="h-4 w-4"></i></button><button class="btn btn-quiet icon-btn" title="Compartir proyecto cifrado" aria-label="Compartir proyecto cifrado" data-action="share-project" hidden><i data-lucide="share-2" class="h-4 w-4"></i></button><button class="btn btn-primary" data-action="new-task"><i data-lucide="plus" class="h-4 w-4"></i><span class="desktop-only">Nueva tarea</span></button></div>
      </header>
      <main class="main-content mx-auto max-w-[1440px] px-8 pb-16 pt-8">
        <section id="view-home" class="view active"></section>
        <section id="view-files" class="view"></section>
        <section id="view-agenda" class="view"></section>
        <section id="view-study" class="view"></section>
      </main>
      <footer class="mx-8 border-t border-white/[.06] py-5 text-center text-[10px] text-slate-600">Hecho con <i data-lucide="heart" class="inline h-3 w-3 text-pink-400"></i> para estudiar a tu manera <span class="mx-2 text-slate-800">/</span> Tus datos son tuyos</footer>
    </div>
    <nav class="mobile-nav fixed inset-x-0 bottom-0 z-40 hidden justify-around border-t border-white/10 bg-[#090b10]/95 px-2 py-2 backdrop-blur-xl" aria-label="Navegación móvil">
      <button class="nav-btn active flex flex-col items-center gap-1 px-3 py-1 text-[9px]" data-view="home"><i data-lucide="layout-dashboard" class="h-4 w-4"></i>Resumen</button><button class="nav-btn flex flex-col items-center gap-1 px-3 py-1 text-[9px]" data-view="files"><i data-lucide="hard-drive" class="h-4 w-4"></i>Archivos</button><button class="nav-btn flex flex-col items-center gap-1 px-3 py-1 text-[9px]" data-view="agenda"><i data-lucide="calendar-days" class="h-4 w-4"></i>Agenda</button><button class="nav-btn flex flex-col items-center gap-1 px-3 py-1 text-[9px]" data-view="study"><i data-lucide="notebook-pen" class="h-4 w-4"></i>Estudio</button>
    </nav>
  </div>

  <dialog id="modal" class="modal"><form id="modal-form" method="dialog"><div class="flex items-center justify-between border-b border-white/[.08] px-5 py-4"><h2 id="modal-title" class="m-0 text-sm font-extrabold">Nuevo elemento</h2><button class="btn btn-quiet icon-btn" value="cancel" aria-label="Cerrar"><i data-lucide="x" class="h-4 w-4"></i></button></div><div id="modal-body" class="space-y-4 p-5"></div><div class="flex justify-end gap-2 border-t border-white/[.08] px-5 py-4"><button class="btn" value="cancel">Cancelar</button><button id="modal-submit" class="btn btn-primary" value="default">Guardar</button></div></form></dialog>
  <input id="file-picker" type="file" multiple hidden>
  <input id="package-picker" type="file" accept=".estudio,application/json" hidden>
  <div id="toast-stack" class="fixed bottom-5 right-5 z-[80] flex w-[min(360px,calc(100%-32px))] flex-col gap-2"></div>

  <script>
    (()=>{
      'use strict';
      const DB_NAME='estudio-local-v1', STORE='blobs', STATE_KEY='estudio-state-v1';
      const ICONS=['orbit','sparkles','hexagon','asterisk','sun','command'];
      const icon=ICONS[Math.floor(Math.random()*ICONS.length)];
      document.querySelector('#brand-mark').innerHTML=`<i data-lucide="${icon}" class="h-5 w-5"></i>`;
      const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
      const blankState=()=>({username:'Local',projects:[],tasks:[],files:[],notes:[]});
      let state; let db; let activeView='home'; let activeProject=null; let selectedDate=todayISO(); let calendarDate=new Date(); let activeNote=null; let noteMode='theory'; let query=''; let pendingImportFile=null; let pendingModalAction=null; let pendingReviewNote=null;
      const $=(selector,root=document)=>root.querySelector(selector); const $$=(selector,root=document)=>[...root.querySelectorAll(selector)];
      const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`;
      const save=()=>localStorage.setItem(STATE_KEY,JSON.stringify(state));
      function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE,{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
      function blobRequest(method,value){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');const req=value===undefined?tx.objectStore(STORE)[method]():tx.objectStore(STORE)[method](value);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
      const readBlob=id=>blobRequest('get',id); const putBlob=value=>blobRequest('put',value); const removeBlob=id=>blobRequest('delete',id);
      function toast(message,type='ok'){const node=document.createElement('div');node.className='toast surface flex items-center gap-3 rounded-xl px-4 py-3 text-xs shadow-2xl';node.innerHTML=`<i data-lucide="${type==='error'?'circle-alert':'circle-check'}" class="h-4 w-4 ${type==='error'?'text-rose-300':'text-teal-200'}"></i><span>${escapeHTML(message)}</span>`;$('#toast-stack').append(node);lucide.createIcons();setTimeout(()=>node.remove(),3600)}
      const formatBytes=n=>n<1024?`${n} B`:n<1048576?`${(n/1024).toFixed(1)} KB`:`${(n/1048576).toFixed(1)} MB`;
      const dateLabel=(iso,options={weekday:'short',day:'numeric',month:'short'})=>new Intl.DateTimeFormat('es-ES',options).format(new Date(`${iso}T12:00:00`));
      function iconMark(name,extra=''){return `<i data-lucide="${name}" class="${extra}"></i>`}
      function projectName(id){return state.projects.find(p=>p.id===id)?.name||'Sin proyecto'}
      function setView(view){activeView=view;activeProject=null;$$('.view').forEach(el=>el.classList.toggle('active',el.id===`view-${view}`));$$('[data-view]').forEach(el=>el.classList.toggle('active',el.dataset.view===view));$('#breadcrumb').textContent=({home:'Resumen',files:'Archivos',agenda:'Agenda',study:'Estudio'})[view]||'Resumen';render();window.scrollTo({top:0,behavior:'smooth'})}
      function render(){updateShell();if(activeView==='home')renderHome();if(activeView==='files')renderFiles();if(activeView==='agenda')renderAgenda();if(activeView==='study'){renderStudy();renderStudyAttachments()}$$('.view.active .surface').forEach((card,index)=>{if(index===1)card.classList.add('tilt')});lucide.createIcons();if(window.gsap)gsap.fromTo('.view.active .enter',{y:10,opacity:0},{y:0,opacity:1,duration:.35,stagger:.045,ease:'power2.out',clearProps:'all'})}
      function renderStudyAttachments(){if(noteMode!=='review'||!activeNote)return;const note=state.notes.find(n=>n.id===activeNote),textarea=$('#study-content');if(!note||!textarea)return;const host=document.createElement('div');host.className='review-media mt-5';host.innerHTML=`<div class="mb-3 flex flex-wrap items-center justify-between gap-3"><div><div class="text-xs font-bold">Referencias visuales</div><div class="mt-1 text-[10px] text-slate-600">Imágenes y vídeos guardados solo en este dispositivo.</div></div><button class="btn" data-action="upload-review">${iconMark('image-plus','h-4 w-4')}Añadir imagen o vídeo</button></div><div class="grid gap-3 sm:grid-cols-2" data-review-grid></div>`;textarea.after(host);const grid=host.querySelector('[data-review-grid]');state.files.filter(file=>file.noteId===note.id).forEach(async file=>{const figure=document.createElement('figure');figure.className='m-0 overflow-hidden rounded-xl border border-white/[.08] bg-black/20';const media=document.createElement(file.type.startsWith('video/')?'video':'img');media.className='max-h-[360px] w-full object-contain';media.controls=file.type.startsWith('video/');media.alt=file.name;const caption=document.createElement('figcaption');caption.className='flex items-center justify-between gap-2 p-2';caption.innerHTML=`<span class="truncate text-[10px] text-slate-400">${escapeHTML(file.name)}</span><span class="flex shrink-0 gap-1"><button class="btn btn-quiet icon-btn h-7 w-7" data-download-file="${escapeHTML(file.id)}" aria-label="Descargar ${escapeHTML(file.name)}">${iconMark('download','h-3 w-3')}</button><button class="btn btn-quiet icon-btn h-7 w-7 text-slate-600 hover:text-rose-300" data-delete-file="${escapeHTML(file.id)}" aria-label="Eliminar ${escapeHTML(file.name)}">${iconMark('trash-2','h-3 w-3')}</button></span>`;figure.append(media,caption);grid.append(figure);const stored=await readBlob(file.id);if(stored?.blob)media.src=URL.createObjectURL(stored.blob)})}
      function updateShell(){
        $('#user-name').textContent=state.username||'Local';$('#avatar').textContent=(state.username||'L').trim().slice(0,1).toUpperCase();$('#nav-files-count').textContent=state.files.length;$('#nav-tasks-count').textContent=state.tasks.filter(t=>!t.done).length;for(const action of ['share-project','edit-project','delete-project'])$(`[data-action="${action}"]`).hidden=!activeProject;if(activeView==='files')$('#breadcrumb').textContent=activeProject?projectName(activeProject):'Archivos';
        $('#sidebar-projects').innerHTML=state.projects.map(p=>`<button class="nav-btn flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-xs font-semibold ${activeProject===p.id?'active':''}" data-project="${escapeHTML(p.id)}"><span class="h-2 w-2 rounded-sm" style="background:${escapeHTML(p.color||'#5eead4')}"></span><span class="truncate">${escapeHTML(p.name)}</span><span class="mono ml-auto text-[9px] text-slate-600">${state.files.filter(f=>f.projectId===p.id).length}</span></button>`).join('');
      }
      function renderHome(){
        const pending=state.tasks.filter(t=>!t.done).sort((a,b)=>(a.due||'').localeCompare(b.due||''));const recent=[...state.files].sort((a,b)=>b.createdAt-a.createdAt).slice(0,4);const todayTasks=state.tasks.filter(t=>t.due===todayISO()&&!t.done).length;const totalBytes=state.files.reduce((sum,f)=>sum+(f.size||0),0);
        $('#view-home').innerHTML=`
          <div class="enter mb-8 flex flex-wrap items-end justify-between gap-5"><div><div class="mono mb-3 flex items-center gap-2 text-[10px] uppercase tracking-[.2em] text-teal-200"><span class="ping h-1.5 w-1.5 rounded-full bg-teal-300"></span>Tu espacio, sin ruido</div><h1 class="m-0 text-3xl font-extrabold tracking-tight sm:text-[38px]">Hola, ${escapeHTML(state.username||'Local')}<span class="text-teal-300">.</span></h1><p class="mb-0 mt-2 text-sm text-slate-500">Un lugar privado para pensar, guardar y avanzar.</p></div><button class="btn" data-action="new-project">${iconMark('folder-plus','h-4 w-4')}<span>Crear proyecto</span></button></div>
          <div class="mb-5 grid gap-3 sm:grid-cols-2 xl:grid-cols-4">
            ${statCard('folders','Proyectos',state.projects.length,'en este dispositivo','text-teal-200')}${statCard('files','Archivos',state.files.length,formatBytes(totalBytes)+' guardados','text-blue-200')}${statCard('list-checks','Por hacer',pending.length,todayTasks?`${todayTasks} para hoy`:'sin tareas para hoy','text-lime-200')}${statCard('notebook-tabs','Resúmenes',state.notes.length,'modos de repaso incluidos','text-pink-200')}
          </div>
          <div class="mb-5 grid gap-4 xl:grid-cols-[1.45fr_.85fr]">
            <section class="surface glow-border enter rounded-2xl p-5 sm:p-6"><div class="mb-5 flex items-center justify-between"><div><div class="mono text-[9px] uppercase tracking-[.18em] text-slate-500">En marcha</div><h2 class="mb-0 mt-1 text-base font-extrabold">Próximos pasos</h2></div><button class="btn btn-quiet text-xs" data-view="agenda">Abrir agenda ${iconMark('arrow-up-right','h-3.5 w-3.5')}</button></div><div id="home-tasks">${pending.slice(0,4).map(taskRow).join('')||emptyInline('check-check','Sin tareas pendientes. Un buen momento para empezar.','new-task')}</div><button class="mt-4 flex w-full items-center justify-center gap-2 rounded-lg border border-dashed border-white/10 py-3 text-xs font-bold text-slate-500 transition hover:border-teal-200/30 hover:text-teal-100" data-action="new-task">${iconMark('plus','h-4 w-4')}Añadir tarea</button></section>

      $('#modal-form').addEventListener('submit',event=>{event.preventDefault();const form=event.currentTarget,type=form.dataset.type,data=Object.fromEntries(new FormData(form).entries());if(type==='confirm'){const action=pendingModalAction;pendingModalAction=null;$('#modal').close();action?.();return}if(type==='export'){if(data.password!==data.confirmPassword){toast('Las claves no coinciden.','error');return}$('#modal').close();exportEncrypted(form.dataset.projectId||null,data.password);return}if(type==='import'){const file=pendingImportFile;pendingImportFile=null;$('#modal').close();if(file)importEncrypted(file,data.password);return}if(type==='project'){if(form.dataset.editId){Object.assign(state.projects.find(p=>p.id===form.dataset.editId),data)}else state.projects.push({id:uid(),name:data.name.trim(),description:data.description.trim(),color:data.color,createdAt:Date.now()})}if(type==='task')state.tasks.push({id:uid(),title:data.title.trim(),due:data.due,projectId:data.projectId||null,done:false,createdAt:Date.now()});if(type==='note'){if(form.dataset.editId){const note=state.notes.find(n=>n.id===form.dataset.editId);note.title=data.title.trim();note.subject=data.subject.trim()}else{const note={id:uid(),title:data.title.trim(),subject:data.subject.trim(),theory:'',practice:'',exam:'',review:''};state.notes.unshift(note);activeNote=note.id}}if(type==='profile')state.username=data.username.trim()||'Local';save();$('#modal').close();render();toast(type==='task'?'Tarea añadida':'Cambios guardados')});
